<!DOCTYPE html>
<html lang="en">

<body>
    <script>
        //1. Doing arithmetic with functions:
        function add(num1, num2) {
            return num1 + num2;
        };
        function multiply(num1, num2) {
            return num1 * num2;
        };
        console.log(add(multiply(36325, 9824), 777));
        console.log("---------------------------------------------------");
        //2.Are these arrays the same?
        function areArraysSame(numArr1, numArr2) {
            if (numArr1.length !== numArr2.length) {
                return false;
            }
            for (var i = 0; i < numArr1.length; i++) {
                if (numArr1[i] !== numArr2[i]) {
                    return false;
                }
            }
            return true;
        };
        console.log(areArraysSame([1, 2, 3], [4, 5, 6]));
        console.log(areArraysSame([1, 2, 3], [1, 2, 3]));
        console.log(areArraysSame([1, 2, 3], [1, 2, 3, 4]));
    </script>
</body>

</html>
