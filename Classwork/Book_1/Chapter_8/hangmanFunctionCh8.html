<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman Challenge</title>
</head>

<body>
    <script>
        //3. Hangman with functions challenge:

        var pickWord = function () {
            // Return a random word
            var words = [
                "javascript",
                "monkey",
                "amazing",
                "pancake",
                "hippopotamus",
                "squirrel",
                "alligator",
                "chicken",
                "supercalifragilisticexpialidocious"
            ];
            return words[Math.floor(Math.random() * words.length)];
        };
        var setupAnswerArray = function (word) {
            // Return the answer array
            var answerArray = [];
            for (var i = 0; i < word.length; i++) {
                answerArray[i] = "_";
            }
            return answerArray;
        };
        var showPlayerProgress = function (answerArray) {
            // Use alert to show the player their progress
            alert(answerArray.join(" "));
        };
        var getGuess = function () {
            // Use prompt to get a guess
            return prompt("Guess a letter!");

        };
        var updateGameState = function (guess, word, answerArray) {
            // Update answerArray and return a number showing how many
            // times the guess appears in the word so remainingLetters
            // can be updated
            guess = guess.toLowerCase();
            // created matches to store and increment the amount of correct guesses/matches that match letters from the selected word
            var matches = 0;
            for (var i = 0; i < word.length; i++) {
                if (word[i] === guess && answerArray[i] === "_") {
                    answerArray[i] = guess;
                    matches++;
                }
            }
            return matches;
        };
        var showAnswerAndCongratulatePlayer = function (answerArray) {
            // Use alert to show the answer and congratulate the player
            alert("Good job! The answer was " + answerArray.join("") + "!!!");
        };

        var word = pickWord();
        var answerArray = setupAnswerArray(word);
        var remainingLetters = word.length;
        while (remainingLetters > 0) {
            showPlayerProgress(answerArray);
            var guess = getGuess();
            if (guess === null) {
                break;
            } else if (guess.length !== 1) {
                alert("Please enter a single letter.");
            } else {
                var correctGuesses = updateGameState(guess, word, answerArray);
                remainingLetters -= correctGuesses;
            }
        }
        showAnswerAndCongratulatePlayer(answerArray);

    </script>
</body>

</html>
